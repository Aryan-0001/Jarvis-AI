name: Python syntax

on:
  push:
    paths:
      - 'JarvisWindows/**/*.py'
      - 'jarvis-vision/**/*.py'
      - '.github/workflows/python-syntax.yml'
  pull_request:
    paths:
      - 'JarvisWindows/**/*.py'
      - 'jarvis-vision/**/*.py'
      - '.github/workflows/python-syntax.yml'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax without importing runtime dependencies
        run: python -m compileall -q JarvisWindows jarvis-vision
